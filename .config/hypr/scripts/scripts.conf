bind = SUPER, T, exec, alacritty --title "Timer" -e ~/.config/hypr/scripts/waybar_timer.sh
bind = SUPER, SPACE, exec, alacritty --title "launcher" -e ~/.config/hypr/scripts/launcher.sh 
bind = SUPER, TAB, exec, alacritty --title "launcher" -e ~/.config/hypr/scripts/Launcher/window
bindd = SUPER , M, Music Player, exec, ~/.config/hypr/scripts/cmus-init.sh
